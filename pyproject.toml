[project]
name = "streetpano"
version = "0.1.0"
description = "Build very long street panoramas from photos taken while walking along a street."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Reto Küpfer" }]
keywords = ["panorama", "image-stitching", "parallax", "computer-vision", "photography"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Typing :: Typed",
]
dependencies = [
    "numpy>=2.0",
    "pillow>=11.0",
]

[project.scripts]
streetpano = "streetpano.cli:main"

[project.optional-dependencies]
sfm = ["pycolmap>=4.2"]

[dependency-groups]
dev = [
  "hypothesis>=6.100",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "pycolmap>=4.2",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]
docs = ["mkdocs-material>=9.5"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/streetpano"]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=streetpano --cov-branch --cov-report=term-missing --cov-fail-under=95"
testpaths = ["tests"]
xfail_strict = true

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PT", "RUF", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "SIM300"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "pycolmap"
ignore_missing_imports = true
