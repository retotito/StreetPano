  <rect x="607.0" y="138.8" width="32.0" height="28.0" fill="#ffffff" stroke="#6b7280" stroke-width="1" rx="0"/>
  <rect x="731.0" y="138.8" width="32.0" height="28.0" fill="#ffffff" stroke="#6b7280" stroke-width="1" rx="0"/>
