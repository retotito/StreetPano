  <line x1="95.0" y1="300.0" x2="135.0" y2="70.0" stroke="#dc2626" stroke-width="3"/>
  <line x1="345.0" y1="300.0" x2="305.0" y2="70.0" stroke="#dc2626" stroke-width="3"/>
  <text x="545.0" y="30.0" font-size="16" fill="#15803d" text-anchor="start" font-weight="600">Corrected: walls are truly vertical</text>
  <rect x="560.0" y="70.0" width="250.0" height="230.0" fill="#e5e7eb" stroke="#6b7280" stroke-width="2" rx="0"/>
