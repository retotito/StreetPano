<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 355" width="880" height="355" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">Correcting vertical lines</title>
  <desc id="d">A tilted camera makes walls lean inwards. Rotating the camera model makes them vertical, and a user can draw a line to guide it.</desc>
