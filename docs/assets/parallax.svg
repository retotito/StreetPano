<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">Parallax between two photos</title>
  <desc id="d">Two camera positions see a nearby car against different parts of the facade.</desc>
  <rect width="900" height="450" fill="#ffffff"/>
  <rect x="40.0" y="36.0" width="820.0" height="34.0" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1" rx="0"/>
  <text x="50.0" y="58.0" font-size="15" fill="#1f2937" text-anchor="start" font-weight="400">Facade, 15 m away</text>
  <line x1="330.0" y1="370.0" x2="690.0" y2="70.0" stroke="#2563eb" stroke-width="2"/>
  <line x1="570.0" y1="370.0" x2="210.0" y2="70.0" stroke="#d97706" stroke-width="2"/>
  <rect x="416.0" y="257.0" width="68.0" height="26.0" fill="#374151" stroke="none" stroke-width="1" rx="5"/>
  <text x="494.0" y="275.0" font-size="15" fill="#1f2937" text-anchor="start" font-weight="400">Car, 5 m away</text>
  <circle cx="330.0" cy="370.0" r="8" fill="#2563eb"/>
  <circle cx="570.0" cy="370.0" r="8" fill="#d97706"/>
  <text x="330.0" y="400.0" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="600">Photo A</text>
  <text x="570.0" y="400.0" font-size="15" fill="#d97706" text-anchor="middle" font-weight="600">Photo B</text>
  <line x1="330.0" y1="414.0" x2="570.0" y2="414.0" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="330.0" y1="408.0" x2="330.0" y2="420.0" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="570.0" y1="408.0" x2="570.0" y2="420.0" stroke="#6b7280" stroke-width="1.5"/>
  <text x="450.0" y="434.0" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="400">3 m walked</text>
  <circle cx="690.0" cy="70.0" r="6" fill="#2563eb"/>
  <circle cx="210.0" cy="70.0" r="6" fill="#d97706"/>
  <text x="704.0" y="94.0" font-size="14" fill="#2563eb" text-anchor="start" font-weight="400">A sees the car here</text>
  <text x="196.0" y="94.0" font-size="14" fill="#d97706" text-anchor="end" font-weight="400">B sees the car here</text>
  <text x="40.0" y="434.0" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400">Top view, not to scale</text>
</svg>
