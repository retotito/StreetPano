<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" width="700" height="560" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">Parked cars hide the bottom of the facade</title>
  <desc id="d">Side view comparing a camera at 1.6 metres, where the lower facade is hidden, with a camera at 3 metres, where it is visible.</desc>
  <rect width="700" height="560" fill="#ffffff"/>
  <text x="30.0" y="24.0" font-size="17" fill="#1f2937" text-anchor="start" font-weight="600">Camera at eye height</text>
  <rect x="510.0" y="35.0" width="70.0" height="195.0" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1" rx="0"/>
  <rect x="210.0" y="185.0" width="60.0" height="45.0" fill="#374151" stroke="none" stroke-width="1" rx="5"/>
  <rect x="510.0" y="188.4" width="70.0" height="41.6" fill="#dc2626" stroke="none" stroke-width="1" rx="0" fill-opacity="0.75"/>
  <text x="590.0" y="214.2" font-size="15" fill="#dc2626" text-anchor="start" font-weight="600">hidden</text>
  <line x1="60.0" y1="182.0" x2="510.0" y2="188.4" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="60.0" y1="230.0" x2="60.0" y2="182.0" stroke="#2563eb" stroke-width="3"/>
  <circle cx="60.0" cy="182.0" r="7" fill="#2563eb"/>
  <text x="74.0" y="174.0" font-size="14" fill="#2563eb" text-anchor="start" font-weight="600">Camera 1.6 m</text>
  <text x="240.0" y="212.5" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="400">Car 1.5 m</text>
  <line x1="10.0" y1="230.0" x2="660.0" y2="230.0" stroke="#1f2937" stroke-width="2"/>
  <text x="545.0" y="57.0" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="400">Facade</text>
  <text x="60.0" y="256.0" font-size="15" fill="#dc2626" text-anchor="start" font-weight="600">About the bottom 1.4 m is never visible</text>
  <text x="30.0" y="304.0" font-size="17" fill="#1f2937" text-anchor="start" font-weight="600">Camera on a 3 m pole</text>
  <rect x="510.0" y="315.0" width="70.0" height="195.0" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1" rx="0"/>
  <rect x="210.0" y="465.0" width="60.0" height="45.0" fill="#374151" stroke="none" stroke-width="1" rx="5"/>
  <line x1="60.0" y1="420.0" x2="480.0" y2="510.0" stroke="#15803d" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="60.0" y1="510.0" x2="60.0" y2="420.0" stroke="#2563eb" stroke-width="3"/>
  <circle cx="60.0" cy="420.0" r="7" fill="#2563eb"/>
  <text x="74.0" y="412.0" font-size="14" fill="#2563eb" text-anchor="start" font-weight="600">Camera 3 m</text>
  <text x="240.0" y="492.5" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="400">Car 1.5 m</text>
  <line x1="10.0" y1="510.0" x2="660.0" y2="510.0" stroke="#1f2937" stroke-width="2"/>
  <text x="545.0" y="337.0" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="400">Facade</text>
  <text x="60.0" y="536.0" font-size="15" fill="#15803d" text-anchor="start" font-weight="600">The whole facade is visible above the car</text>
</svg>
