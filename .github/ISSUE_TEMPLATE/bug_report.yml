name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: StreetPano version and operating system
    validations:
      required: true
