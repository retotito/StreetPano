name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    name: Formatting and C++ rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - run: uv sync --locked --project tools
      - name: Check C++ memory rules
        run: uv run --project tools python -m streetpano.cpp_rules .
      - name: Check C++ formatting
        run: git ls-files '*.cpp' '*.hpp' | xargs uv run --project tools clang-format --dry-run --Werror

  cpp:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux GCC, os: ubuntu-24.04, cc: gcc, cxx: g++ }
          - { name: Linux Clang, os: ubuntu-24.04, cc: clang, cxx: clang++ }
          - { name: macOS, os: macos-latest }
          - { name: Windows, os: windows-latest }
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build qt6-base-dev libgl-dev
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja qtbase
      - name: Set up the Windows compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          cache: true
      - name: Configure
        run: cmake --preset dev
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
      - name: Build
        run: cmake --build --preset dev
      - name: Test
        run: ctest --preset dev

  sanitizers:
    name: Memory checks (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, tsan]
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:detect_stack_use_after_return=1
      LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/sanitizers/lsan.supp:print_suppressions=0
      UBSAN_OPTIONS: print_stacktrace=1
      TSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/sanitizers/tsan.supp
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y ninja-build qt6-base-dev libgl-dev
      - name: Allow ThreadSanitizer's memory layout
        run: sudo sysctl vm.mmap_rnd_bits=28
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - run: sudo apt-get update && sudo apt-get install -y ninja-build qt6-base-dev libgl-dev
      - run: uv sync --locked --project tools
      - run: cmake --preset dev
      - run: cmake --build --preset dev
      - name: Run clang-tidy
        run: git ls-files 'src/*.cpp' 'app/*.cpp' | xargs uv run --project tools clang-tidy -p build/dev --quiet

  coverage:
    name: C++ test coverage
    runs-on: ubuntu-24.04
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - run: sudo apt-get update && sudo apt-get install -y ninja-build qt6-base-dev libgl-dev
      - run: uv sync --locked --project tools
      - run: cmake --preset coverage
      - run: cmake --build --preset coverage
      - run: ctest --preset coverage
      - name: Require coverage
        run: >
          uv run --project tools gcovr --root . build/coverage --filter 'src/'
          --exclude '.*_autogen.*' --print-summary --fail-under-line 85

  python-tools:
    name: Python tools (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - run: uv sync --locked
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Check types
        run: uv run mypy
      - name: Run tests
        run: uv run pytest

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - run: uv sync --locked --project tools
      - name: Build documentation
        run: uv run --project tools mkdocs build --strict
